<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기준 관리 · 논문 글쓰기 진단</title>
<link rel="preload" href="/assets/fonts/SUIT-Variable.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="/assets/fonts/KIMM-Bold.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/assets/style.css"></head><body class="administration">
<header class="topbar"><a class="brand" href="/"><span>논문 글쓰기 진단 <span style="color:#a3aea7;font-weight:400">/ 기준 관리</span></span></a><nav class="appnav" aria-label="작업 선택"><a href="/guide">문서</a><a href="/">진단 화면으로 ↗</a></nav></header>
<section class="login" id="loginPanel"><h1 style="margin:8px 0">관리자 로그인</h1><form id="loginForm"><label>작업자 이름<input id="actor" value="관리자" maxlength="40" autocomplete="username" required></label><label>관리자 비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" style="width:100%;margin-top:24px" id="loginButton">로그인</button><div id="loginError" role="alert"></div></form><p class="subtle" style="margin-top:22px">최초 비밀번호는 프로젝트의<br><code>data/admin/initial_password.txt</code>에 있습니다.</p></section>
<div class="shell" id="workspace" hidden><aside><div class="kicker">분야별 적용 기준</div><div id="groups"></div><nav class="tabs" aria-label="관리 메뉴"><button data-tab="current" class="selected">현재 기준 · 버전</button><button data-tab="recalculate">자료 선택 · 재계산</button><button data-tab="history">변경 이력</button></nav></aside><main class="main"><div class="row"><div><div class="kicker" id="groupCode"></div><h1 id="heading">기준 관리</h1></div><div class="tools"><span class="subtle" id="actorLabel"></span><button id="refresh">새로고침</button><button id="logout">로그아웃</button></div></div><div id="message" role="alert"></div><div id="content"><p class="loading">기준을 불러오고 있습니다…</p></div></main></div>
<dialog id="previewDialog"><div class="row"><h2>기준 버전 미리보기</h2><button id="closePreview">닫기</button></div><div id="previewContent"></div></dialog>
<dialog id="applyDialog"><h2 id="applyTitle">기준 적용</h2><p id="applyDescription" class="subtle"></p><form id="applyForm"><label class="field">변경 사유<textarea id="applyReason" maxlength="1000" placeholder="왜 이 버전을 적용하는지 기록하세요" required></textarea></label><div id="applyError" role="alert"></div><div class="tools" style="justify-content:flex-end;margin-top:15px"><button type="button" id="cancelApply">취소</button><button class="primary" id="confirmApply">적용하고 이력 기록</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div><footer class="font-credit"><details><summary>서체 출처</summary><p class="font-attribution">본 저작물은 '한국기계연구원'에서 '2022년' 작성하여 공공누리 제1유형으로 개방한 '한국기계연구원 서체'를 이용하였으며, 해당 저작물은 <a href="https://www.kimm.re.kr/webfont" target="_blank" rel="noopener">한국기계연구원</a>에서 무료로 내려받을 수 있습니다.</p></details></footer><script src="/admin.js"></script></body></html>
