<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 앱</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: #111827;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }
    .app {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 24px;
      align-self: flex-start;
    }
    h1 { margin: 0 0 16px; font-size: 22px; }
    form { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    .add { background: #2563eb; color: #fff; }
    .add:hover { background: #1d4ed8; }
    .filters { display: flex; gap: 6px; margin: 16px 0 8px; }
    .filters button { background: #e5e7eb; color: #374151; padding: 6px 12px; }
    .filters button.active { background: #111827; color: #fff; }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid #f3f4f6;
    }
    li span { flex: 1; word-break: break-all; }
    li.done span { text-decoration: line-through; color: #9ca3af; }
    .del { background: transparent; color: #9ca3af; padding: 4px 8px; }
    .del:hover { color: #dc2626; }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 13px;
      color: #6b7280;
    }
    .clear { background: transparent; color: #6b7280; padding: 4px 8px; font-size: 13px; }
    .clear:hover { color: #dc2626; }
    .empty { text-align: center; color: #9ca3af; padding: 24px 0; }
  </style>
</head>
<body>
  <main class="app">
    <h1>할 일 앱</h1>

    <form id="form">
      <input type="text" id="input" placeholder="할 일을 입력하세요" autocomplete="off" required>
      <button type="submit" class="add">추가</button>
    </form>

    <div class="filters" id="filters">
      <button data-filter="all" class="active">전체</button>
      <button data-filter="active">진행 중</button>
      <button data-filter="done">완료</button>
    </div>

    <ul id="list"></ul>

    <div class="footer">
      <span id="count"></span>
      <button class="clear" id="clear">완료 항목 삭제</button>
    </div>
  </main>

  <script>
    const STORAGE_KEY = 'todos';
    let todos = [];
    let filter = 'all';

    try {
      todos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      todos = [];
    }

    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const list = document.getElementById('list');
    const count = document.getElementById('count');
    const filters = document.getElementById('filters');

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      } catch (e) {}
    }

    function render() {
      const visible = todos.filter(t =>
        filter === 'all' ? true : filter === 'done' ? t.done : !t.done
      );

      list.innerHTML = '';
      if (visible.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent = '할 일이 없습니다';
        list.appendChild(empty);
      }

      visible.forEach(t => {
        const li = document.createElement('li');
        if (t.done) li.className = 'done';

        const check = document.createElement('input');
        check.type = 'checkbox';
        check.checked = t.done;
        check.addEventListener('change', () => {
          t.done = check.checked;
          save();
          render();
        });

        const text = document.createElement('span');
        text.textContent = t.text;

        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '✕';
        del.setAttribute('aria-label', '삭제');
        del.addEventListener('click', () => {
          todos = todos.filter(x => x.id !== t.id);
          save();
          render();
        });

        li.append(check, text, del);
        list.appendChild(li);
      });

      const remaining = todos.filter(t => !t.done).length;
      count.textContent = `남은 할 일 ${remaining}개`;

      filters.querySelectorAll('button').forEach(b =>
        b.classList.toggle('active', b.dataset.filter === filter)
      );
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      todos.push({ id: Date.now(), text, done: false });
      input.value = '';
      save();
      render();
    });

    filters.addEventListener('click', e => {
      const f = e.target.dataset.filter;
      if (!f) return;
      filter = f;
      render();
    });

    document.getElementById('clear').addEventListener('click', () => {
      todos = todos.filter(t => !t.done);
      save();
      render();
    });

    render();
  </script>
</body>
</html>
