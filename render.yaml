services:
  - type: web
    name: gnu-10team
    runtime: python
    buildCommand: bash scripts/render-build.sh
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
